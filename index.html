<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Music Card</title>

<style>
body {
    background: #111;
    color: white;
    font-family: Arial;
    text-align: center;
    padding: 30px;
}

img {
    width: 280px;
    height: 280px;
    object-fit: cover;
    border-radius: 15px;
}

h1 {
    margin-bottom: 5px;
}

p {
    color: #aaa;
}

audio {
    width: 100%;
    margin-top: 20px;
}
</style>
</head>

<body>

<img src="cover.jpg">

<h1>My Song</h1>
<p>My Artist</p>

<audio controls>
    <source src="song.mp3" type="audio/mpeg">
</audio>

</body>
</html>
